<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <!-- Fixed: Replacing Play CDN script with static Tailwind CSS stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #09090b; /* zinc-950 fallback */
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-zinc-800">

    <!-- Top Navigation -->
    <nav class="fixed top-0 left-0 w-full z-40 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
            <button onclick="goBack()" class="text-xs sm:text-sm uppercase tracking-widest text-zinc-400 hover:text-white transition flex items-center gap-2 bg-transparent border-0 p-0 cursor-pointer">
                <i class="fa-solid fa-arrow-left"></i> BACK
            </button>
            <span class="text-base sm:text-xl font-light tracking-widest uppercase">Aura<span class="font-bold">Architecture</span></span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-32 pb-24 max-w-4xl mx-auto px-4 sm:px-6 min-h-screen space-y-8 sm:space-y-12">
        <div id="loading-state" class="text-center py-20 text-zinc-500">
            <p>Loading project details...</p>
        </div>

        <div id="project-container" class="space-y-8 sm:space-y-12 hidden">
            <div>
                <span id="proj-category" class="text-xs uppercase tracking-widest text-zinc-500 block mb-2">Category</span>
                <h1 id="proj-title" class="text-2xl sm:text-3xl md:text-5xl font-light tracking-tight text-white">Title</h1>
                <p id="proj-location" class="text-xs sm:text-sm text-zinc-400 mt-2"><i class="fa-solid fa-location-dot mr-1"></i> <span></span></p>
            </div>

            <!-- Dynamic Image & Description Sections -->
            <div id="content-sections" class="space-y-12 sm:space-y-16">
                <!-- Injected via JS -->
            </div>

            <!-- BUY THIS PROJECT FORM SECTION -->
            <div id="buy-project-section" class="bg-zinc-900/60 border border-zinc-800 p-6 sm:p-10 rounded-lg space-y-6 max-w-3xl mx-auto mt-16 hidden">
                <div class="text-center space-y-2">
                    <h3 class="text-xl sm:text-2xl font-light text-white tracking-wide uppercase">
                        Buy This Project Blueprint
                    </h3>
                    <p class="text-xs sm:text-sm text-zinc-400">
                        Select the options you need and leave your contact details below. Our team will reach out shortly.
                    </p>
                </div>

                <form id="order-form" onsubmit="submitOrderForm(event)" class="space-y-6">
                    <div class="space-y-3 pt-2">
                        <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-2">Select Included Packages</label>
                        
                        <label class="flex items-center gap-3 p-3 bg-zinc-950 border border-zinc-800/80 rounded cursor-pointer hover:border-zinc-700 transition">
                            <input type="checkbox" name="options" value="Full Architectural Drawings" class="w-4 h-4 accent-white rounded border-zinc-700 bg-zinc-900">
                            <span class="text-xs sm:text-sm text-zinc-300">Full Architectural Drawings & Floor Plans</span>
                        </label>

                        <label class="flex items-center gap-3 p-3 bg-zinc-950 border border-zinc-800/80 rounded cursor-pointer hover:border-zinc-700 transition">
                            <input type="checkbox" name="options" value="Structural & MEP Engineering" class="w-4 h-4 accent-white rounded border-zinc-700 bg-zinc-900">
                            <span class="text-xs sm:text-sm text-zinc-300">Structural & MEP (Electrical & Plumbing) Engineering</span>
                        </label>

                        <label class="flex items-center gap-3 p-3 bg-zinc-950 border border-zinc-800/80 rounded cursor-pointer hover:border-zinc-700 transition">
                            <input type="checkbox" name="options" value="3D Rendering Source Files" class="w-4 h-4 accent-white rounded border-zinc-700 bg-zinc-900">
                            <span class="text-xs sm:text-sm text-zinc-300">3D Rendering Source Files & High-Res Views</span>
                        </label>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Full Name</label>
                            <input type="text" id="order-name" required placeholder="Enter your full name" 
                                   class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 transition">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Email Address</label>
                                <input type="email" id="order-email" required placeholder="example@gmail.com" 
                                       class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Phone Number</label>
                                <input type="tel" id="order-phone" required placeholder="012 345 678" 
                                       class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 transition">
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="order-submit-btn" 
                            class="w-full bg-white text-zinc-950 font-medium py-3 rounded hover:bg-zinc-200 transition text-sm uppercase tracking-wider mt-4">
                        Send Purchase Inquiry
                    </button>

                    <p id="order-status" class="text-xs text-center hidden mt-2"></p>
                </form>
            </div>
        </div>
    </main>

    <footer class="py-12 border-t border-zinc-900 text-center text-xs text-zinc-600 px-4">
        <p>&copy; 2026 Architectural Portfolio. Powered by Supabase.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://yqrjzrjcgjcsezimeeja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxcmp6cmpjZ2pjc2V6aW1lZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Nzg5NzMsImV4cCI6MjEwNDU1NDk3M30.bbYKOilE6OsgHEwmjoI0e-KBC5SMgH2bN2yYkzmItrk';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentCategory = 'portfolio';
        let currentProjectTitle = 'Project Detail';

        async function getAuthenticatedUser() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session && session.user) return { type: 'google', user: session.user };

            const telegramUser = localStorage.getItem('telegram_user');
            if (telegramUser) return { type: 'telegram', user: JSON.parse(telegramUser) };

            return null;
        }

        function goBack() {
            if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                const activeTab = currentCategory === 'done_work' ? 'donework' : 'work';
                window.location.href = `index.html?tab=${activeTab}`;
            }
        }

        async function loadDetails() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                document.getElementById('loading-state').innerHTML = '<p class="text-red-400">No project ID specified. <button onclick="goBack()" class="underline bg-transparent border-0 text-red-400 cursor-pointer">Return</button>.</p>';
                return;
            }

            try {
                const { data: detailData, error: detailError } = await _supabase
                    .from('project_details')
                    .select('*')
                    .eq('main_project_id', id)
                    .maybeSingle();

                const { data: mainData } = await _supabase
                    .from('main_projects')
                    .select('*')
                    .eq('id', id)
                    .maybeSingle();

                if (detailError || (!detailData && !mainData)) {
                    document.getElementById('loading-state').innerHTML = '<p class="text-red-400">Project details not found. <button onclick="goBack()" class="underline bg-transparent border-0 text-red-400 cursor-pointer">Return</button>.</p>';
                    return;
                }

                currentCategory = mainData?.category || detailData?.category || 'portfolio';
                currentProjectTitle = mainData?.title || detailData?.title || 'Project Detail';

                document.getElementById('proj-category').innerText = currentCategory;
                document.getElementById('proj-title').innerText = currentProjectTitle;
                document.getElementById('proj-location').querySelector('span').innerText = detailData?.client_or_location || mainData?.location || 'Location Not Specified';

                const sectionsContainer = document.getElementById('content-sections');
                sectionsContainer.innerHTML = '';

                let contentRendered = false;

                if (detailData) {
                    for (let i = 1; i <= 5; i++) {
                        const img = detailData[`image_${i}`] || detailData[`image${i}`] || detailData[`img_${i}`];
                        const desc = detailData[`description_${i}`] || detailData[`description${i}`] || detailData[`desc_${i}`];

                        if (img || desc) {
                            contentRendered = true;
                            const block = document.createElement('div');
                            block.className = 'space-y-4 border-b border-zinc-900 pb-12 last:border-b-0';
                            block.innerHTML = `
                                ${img ? `
                                    <div class="aspect-video bg-zinc-900 border border-zinc-800 overflow-hidden rounded">
                                        <img src="${img}" alt="Project Image ${i}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'p-4 text-xs text-red-400 flex items-center justify-center h-full\\'>Image failed to load.</div>';">
                                    </div>` : ''}
                                ${desc ? `<p class="text-zinc-300 font-light leading-relaxed text-sm sm:text-base md:text-lg">${desc}</p>` : ''}
                            `;
                            sectionsContainer.appendChild(block);
                        }
                    }
                }

                if (!contentRendered && mainData?.thumbnail_url) {
                    const block = document.createElement('div');
                    block.className = 'space-y-4';
                    block.innerHTML = `
                        <div class="aspect-video bg-zinc-900 border border-zinc-800 overflow-hidden rounded">
                            <img src="${mainData.thumbnail_url}" alt="${mainData.title}" class="w-full h-full object-cover">
                        </div>
                        ${mainData.short_description ? `<p class="text-zinc-300 font-light leading-relaxed text-sm sm:text-base md:text-lg">${mainData.short_description}</p>` : ''}
                    `;
                    sectionsContainer.appendChild(block);
                }

                const buySection = document.getElementById('buy-project-section');
                if (currentCategory === 'portfolio' || !currentCategory || currentCategory === 'Work') {
                    buySection.classList.remove('hidden');
                } else {
                    buySection.classList.add('hidden');
                }

                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('project-container').classList.remove('hidden');

            } catch (err) {
                console.error('Unhandled Detail Error:', err);
                document.getElementById('loading-state').innerHTML = '<p class="text-red-400">Error retrieving project data.</p>';
            }
        }

        async function submitOrderForm(event) {
            event.preventDefault();
            
            const currentUser = await getAuthenticatedUser();
            if (!currentUser) {
                sessionStorage.setItem('redirect_after_login', window.location.href);
                alert('Please log in before submitting a purchase request.');
                window.location.href = 'login.html';
                return;
            }

            const submitBtn = document.getElementById('order-submit-btn');
            const statusMsg = document.getElementById('order-status');

            const name = document.getElementById('order-name').value.trim();
            const email = document.getElementById('order-email').value.trim();
            const phone = document.getElementById('order-phone').value.trim();

            const checkedOptions = Array.from(document.querySelectorAll('input[name="options"]:checked'))
                .map(cb => cb.value);

            submitBtn.disabled = true;
            submitBtn.innerText = "Sending Order...";

            try {
                const { data, error } = await _supabase
                    .from('project_orders')
                    .insert([{ 
                        project_title: currentProjectTitle,
                        name: name, 
                        email: email, 
                        phone: phone,
                        selected_options: checkedOptions,
                        user_id: currentUser.user.id || currentUser.user.telegram_id
                    }]);

                if (error) throw error;

                statusMsg.innerText = "Thank you! Your purchase request has been received. We will contact you shortly.";
                statusMsg.className = "text-xs text-center text-green-400 mt-2 block";
                document.getElementById('order-form').reset();
            } catch (err) {
                console.error("Submission error:", err);
                statusMsg.innerText = "There was an issue sending your request. Please check Supabase setup or try again.";
                statusMsg.className = "text-xs text-center text-red-400 mt-2 block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Purchase Inquiry";
            }
        }

        window.addEventListener('DOMContentLoaded', loadDetails);
    </script>
</body>
</html>
