<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Aura Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kantumruy Pro', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 p-8 rounded-lg space-y-6 text-center">
        <h1 class="text-xl font-medium border-b border-zinc-800 pb-4">User Profile / ព័ត៌មានគណនី</h1>

        <!-- TELEGRAM PROFILE DISPLAY -->
        <div class="space-y-4">
            <div class="w-24 h-24 rounded-full overflow-hidden mx-auto border-2 border-zinc-700 bg-zinc-950 flex items-center justify-center">
                <img id="user-avatar" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                <i id="user-avatar-placeholder" class="fa-solid fa-user text-3xl text-zinc-600"></i>
            </div>

            <div class="space-y-1">
                <h2 id="user-name" class="text-lg font-semibold text-white">---</h2>
                <p id="user-username" class="text-xs text-zinc-400">---</p>
                <p id="user-id" class="text-xs text-zinc-500 font-mono pt-1">ID: ---</p>
            </div>
        </div>

        <div class="pt-4 border-t border-zinc-800 space-y-3">
            <a href="index.html?tab=donework" class="block w-full py-2.5 bg-zinc-800 hover:bg-zinc-700 rounded text-xs text-zinc-200 transition">
                &larr; ត្រឡប់ទៅកាន់ទំព័រដើម (Back to Home)
            </a>
            
            <button onclick="logoutSession()" class="w-full py-2.5 bg-red-950/40 border border-red-900/50 hover:bg-red-900/60 text-red-300 rounded text-xs transition">
                ចាកចេញពីប្រព័ន្ធ (Log Out)
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://yqrjzrjcgjcsezimeeja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxcmp6cmpjZ2pjc2V6aW1lZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Nzg5NzMsImV4cCI6MjEwNDU1NDk3M30.bbYKOilE6OsgHEwmjoI0e-KBC5SMgH2bN2yYkzmItrk';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            const telegramUserRaw = localStorage.getItem('telegram_user');
            const { data: { session } } = await _supabase.auth.getSession();

            if (telegramUserRaw) {
                // Populate Telegram User Info
                const tgUser = JSON.parse(telegramUserRaw);
                
                document.getElementById('user-name').innerText = `${tgUser.first_name || ''} ${tgUser.last_name || ''}`.trim();
                document.getElementById('user-username').innerText = tgUser.username ? `@${tgUser.username}` : 'No Telegram handle';
                document.getElementById('user-id').innerText = `Telegram ID: ${tgUser.id}`;

                if (tgUser.photo_url) {
                    const avatarImg = document.getElementById('user-avatar');
                    avatarImg.src = tgUser.photo_url;
                    avatarImg.classList.remove('hidden');
                    document.getElementById('user-avatar-placeholder').classList.add('hidden');
                }
            } else if (session && session.user) {
                // Populate Google User Info fallback
                const user = session.user;
                document.getElementById('user-name').innerText = user.user_metadata?.full_name || 'Google User';
                document.getElementById('user-username').innerText = user.email || '';
                document.getElementById('user-id').innerText = `ID: ${user.id}`;
            } else {
                // Redirect if unauthenticated
                window.location.href = 'login.html';
            }
        });

        async function logoutSession() {
            // Clear LocalStorage & Supabase Auth Session
            localStorage.removeItem('telegram_user');
            sessionStorage.removeItem('pending_contact_form');
            await _supabase.auth.signOut();
            
            // Redirect back to main page
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
