<html lang="km">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-zinc-800">

    <!-- Top Navigation -->
    <nav class="fixed top-0 left-0 w-full z-40 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex flex-col sm:flex-row items-center justify-between py-2 sm:py-0 gap-2 sm:gap-0">
            <span class="text-base sm:text-xl font-light tracking-widest uppercase">Aura<span class="font-bold">Architecture</span></span>
            
            <div class="flex space-x-4 sm:space-x-8 text-xs sm:text-sm font-medium">
                <a href="index.html" class="text-white pb-1 border-b-2 border-white transition">Work</a>
                <a href="construction.html" class="text-zinc-400 hover:text-white pb-1 border-b-2 border-transparent transition">Construction - (ម៉ៅការ)</a>
                <a href="about_me.html" class="text-zinc-400 hover:text-white pb-1 border-b-2 border-transparent transition">About Me</a>
            </div>

            <!-- Social Links & User Profile Button -->
            <div class="flex items-center space-x-4 text-zinc-400 text-lg">
                <a href="https://t.me/Auraarchitecture" target="_blank" class="hover:text-white transition" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
                <a href="https://www.facebook.com/share/1BuQeJdsCv/?mibextid=wwXIfr" target="_blank" class="hover:text-white transition" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://www.tiktok.com/@aura.architecture4" target="_blank" class="hover:text-white transition" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                <a href="mailto:Auraarchitecture524@gmail.com" class="hover:text-white transition" title="Gmail"><i class="fa-solid fa-envelope"></i></a>
                
                <!-- ACCOUNT BUTTON -->
                <div class="border-l border-zinc-800 pl-4">
                    <button onclick="handleAccountClick()" class="hover:text-white text-zinc-300 transition flex items-center gap-1.5 text-xs bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-3 py-1.5 rounded-full cursor-pointer focus:outline-none" title="User Account">
                        <i class="fa-solid fa-circle-user text-base"></i>
                        <span class="hidden sm:inline font-medium">Account</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content Area -->
    <main class="pt-36 sm:pt-32 pb-24 max-w-7xl mx-auto px-4 sm:px-6 min-h-screen">
        <section id="section-work">
            <div class="mb-8 sm:mb-12">
                <span class="text-xs uppercase tracking-widest text-zinc-500 block mb-2">Portfolio & Concepts</span>
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-light tracking-tight">Featured Architectural Works</h1>
            </div>
            <div id="projects-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                <p class="text-zinc-500">Loading portfolio...</p>
            </div>
        </section>
    </main>

    <!-- LOGIN REQUIRED MODAL POPUP -->
    <div id="login-modal" class="fixed inset-0 bg-zinc-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-900 border border-zinc-800 p-6 sm:p-8 rounded-lg max-w-sm w-full text-center space-y-5 shadow-2xl">
            <div class="w-12 h-12 bg-zinc-800 text-zinc-100 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            <div class="space-y-2">
                <h4 class="text-lg font-medium text-white">Login Required</h4>
                <p class="text-xs text-zinc-400">Please log in to your account first to proceed.</p>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeLoginModal()" class="w-1/2 py-2.5 text-xs text-zinc-400 bg-zinc-950 border border-zinc-800 rounded hover:text-white transition cursor-pointer">Cancel</button>
                <button onclick="redirectToLogin()" class="w-1/2 py-2.5 text-xs text-zinc-950 bg-white font-medium rounded hover:bg-zinc-200 transition uppercase tracking-wider cursor-pointer">Log In</button>
            </div>
        </div>
    </div>

    <footer class="py-12 border-t border-zinc-900 text-center text-xs text-zinc-600 px-4">
        <p>&copy; 2026 Aura-Architecture. Powered by Davin Store.</p>
    </footer>

    <!-- FLOATING STORE BUTTON -->
    <a href="https://your-store-url.com" target="_blank" rel="noopener noreferrer" 
       class="fixed bottom-4 right-4 z-50 flex items-center gap-1.5 bg-white text-zinc-950 px-2.5 py-1.5 rounded-full shadow-lg hover:bg-zinc-200 hover:scale-105 transition-all duration-300 group border border-zinc-200">
        <i class="fa-solid fa-store text-xs text-zinc-900 group-hover:rotate-6 transition-transform"></i>
        <span class="text-[11px] font-medium tracking-tight">Davin Store</span>
        <i class="fa-solid fa-arrow-right text-[9px] group-hover:translate-x-0.5 transition-transform"></i>
    </a>

    <script>
        const SUPABASE_URL = 'https://yqrjzrjcgjcsezimeeja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxcmp6cmpjZ2pjc2V6aW1lZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Nzg5NzMsImV4cCI6MjEwNDU1NDk3M30.bbYKOilE6OsgHEwmjoI0e-KBC5SMgH2bN2yYkzmItrk';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoggedIn = false;

        async function checkUserSession() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                const telegramUser = localStorage.getItem('telegram_user');
                isLoggedIn = !!((session && session.user) || telegramUser);
            } catch (err) {
                console.error('Session check error:', err);
                isLoggedIn = false;
            }
        }

        // ACCOUNT BUTTON GOES TO users.html
        function handleAccountClick() {
            if (isLoggedIn) {
                window.location.href = 'users.html';
            } else {
                showLoginModal();
            }
        }

        function showLoginModal() {
            const modal = document.getElementById('login-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeLoginModal() {
            const modal = document.getElementById('login-modal');
            if (modal) modal.classList.add('hidden');
        }

        function redirectToLogin() {
            sessionStorage.setItem('redirect_after_login', window.location.href);
            window.location.href = 'login.html';
        }

        async function fetchMainProjects() {
            try {
                const { data, error } = await _supabase.from('main_projects').select('*').order('id', { ascending: false });
                if (error || !data) return;
                
                const workGrid = document.getElementById('projects-grid');
                const workItems = data.filter(p => p.category === 'project' || !p.category);
                
                workGrid.innerHTML = workItems.length === 0 ? '<p class="text-zinc-500">No items found.</p>' : '';
                workItems.forEach(item => workGrid.appendChild(createCard(item)));
            } catch (err) {
                console.error('Fetch error:', err);
            }
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'group bg-zinc-900 border border-zinc-800 overflow-hidden cursor-pointer hover:border-zinc-600 transition';
            card.onclick = () => { window.location.href = `projects_detail.html?id=${item.id}`; };
            card.innerHTML = `
                <div class="aspect-[4/3] bg-zinc-950 overflow-hidden">
                    <img src="${item.thumbnail_url}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                </div>
                <div class="p-4 sm:p-6">
                    <span class="text-xs uppercase tracking-widest text-zinc-500 block mb-2">${item.category || 'Architecture'}</span>
                    <h3 class="text-base sm:text-xl font-medium mb-2">${item.title}</h3>
                    <p class="text-zinc-400 text-xs sm:text-sm font-light line-clamp-2">${item.short_description}</p>
                    <span class="inline-block mt-4 text-xs text-white underline underline-offset-4">View Details &rarr;</span>
                </div>
            `;
            return card;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await checkUserSession();
            fetchMainProjects();
        });
    </script>
</body>
</html>
