<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Portfolio & Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased">

    <!-- Header Navigation -->
    <header class="border-b border-zinc-900 bg-zinc-950/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
            <h1 class="text-lg sm:text-xl font-light tracking-widest uppercase">
                Aura<span class="font-bold">Architecture</span>
            </h1>
            <nav class="flex items-center gap-6 text-xs uppercase tracking-wider">
                <a href="#projects" class="text-zinc-400 hover:text-white transition">Projects</a>
                <a href="#contact" class="text-zinc-400 hover:text-white transition">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-12 space-y-24">
        
        <!-- Contact Form Section -->
        <section id="contact" class="max-w-2xl mx-auto bg-zinc-900/40 border border-zinc-800 p-8 rounded-lg space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-light tracking-wide uppercase">Get In Touch</h2>
                <p class="text-xs text-zinc-400">Fill out the form below to send us a direct message.</p>
            </div>

            <form id="contact-form" onsubmit="submitContactForm(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Full Name</label>
                    <input type="text" id="contact-name" required placeholder="Your Name"
                           class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 transition">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Email Address</label>
                    <input type="email" id="contact-email" required placeholder="example@gmail.com"
                           class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 transition">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Phone Number</label>
                    <input type="tel" id="contact-phone" required placeholder="012 345 678"
                           class="w-full bg-zinc-950 border border-zinc-800 rounded px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-500 transition">
                </div>

                <button type="submit" id="contact-submit-btn" 
                        class="w-full bg-white text-zinc-950 font-medium py-3 rounded hover:bg-zinc-200 transition text-sm uppercase tracking-wider mt-2">
                    Send Message
                </button>

                <p id="form-status" class="text-xs text-center hidden mt-2"></p>
            </form>
        </section>

    </main>

    <footer class="py-8 border-t border-zinc-900 text-center text-xs text-zinc-600">
        <p>&copy; 2026 Architectural Portfolio. Powered by Supabase.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://yqrjzrjcgjcsezimeeja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxcmp6cmpjZ2pjc2V6aW1lZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Nzg5NzMsImV4cCI6MjEwNDU1NDk3M30.bbYKOilE6OsgHEwmjoI0e-KBC5SMgH2bN2yYkzmItrk';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function getAuthenticatedUser() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session && session.user) return { type: 'google', user: session.user };

            const telegramUser = localStorage.getItem('telegram_user');
            if (telegramUser) return { type: 'telegram', user: JSON.parse(telegramUser) };

            return null;
        }

        async function submitContactForm(event) {
            event.preventDefault();
            
            const currentUser = await getAuthenticatedUser();
            if (!currentUser) {
                sessionStorage.setItem('redirect_after_login', window.location.href);
                alert('Please log in first to send a message.');
                window.location.href = 'login.html';
                return;
            }

            const submitBtn = document.getElementById('contact-submit-btn');
            const statusMsg = document.getElementById('form-status');

            const name = document.getElementById('contact-name').value.trim();
            const email = document.getElementById('contact-email').value.trim();
            const phone = document.getElementById('contact-phone').value.trim();

            submitBtn.disabled = true;
            submitBtn.innerText = "Sending...";

            try {
                // Payload strictly matched to contact_submissions columns: name, email, phone
                const { data, error } = await _supabase
                    .from('contact_submissions')
                    .insert([{ 
                        name: name, 
                        email: email, 
                        phone: phone
                    }]);

                if (error) throw error;

                statusMsg.innerText = "Your message has been sent successfully!";
                statusMsg.className = "text-xs text-center text-green-400 mt-2 block";
                document.getElementById('contact-form').reset();
            } catch (err) {
                console.error("Submission error:", err);
                statusMsg.innerText = "Error sending message. Please try again.";
                statusMsg.className = "text-xs text-center text-red-400 mt-2 block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Message";
            }
        }
    </script>
</body>
</html>
