    <script>
        const SUPABASE_URL = 'https://yqrjzrjcgjcsezimeeja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxcmp6cmpjZ2pjc2V6aW1lZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Nzg5NzMsImV4cCI6MjEwNDU1NDk3M30.bbYKOilE6OsgHEwmjoI0e-KBC5SMgH2bN2yYkzmItrk';
        const STORAGE_BUCKET_NAME = 'projects';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let loggedInUser = null;
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        function safeImageUrl(rawPath) {
            if (typeof rawPath !== 'string') return null;
            let trimmed = rawPath.trim();
            if (!trimmed || trimmed === 'null' || trimmed === 'undefined') return null;
            if (trimmed.startsWith('http://') || trimmed.startsWith('https://') || trimmed.startsWith('data:image/')) {
                return trimmed;
            }
            if (trimmed.startsWith('/')) {
                trimmed = trimmed.substring(1);
            }
            if (trimmed.startsWith('storage/v1/object/public/')) {
                return `${SUPABASE_URL}/${trimmed}`;
            }
            const { data } = _supabase.storage.from(STORAGE_BUCKET_NAME).getPublicUrl(trimmed);
            return data?.publicUrl || `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET_NAME}/${trimmed}`;
        }
        async function checkBlocklist(email, userId) {
            if (!email && !userId) return false;
            try {
                if (email) {
                    const { data, error } = await _supabase
                        .from('blocked_users')
                        .select('email')
                        .eq('email', email)
                        .maybeSingle();

                    if (!error && data) {
                        alert('Your account has been blocked by the administrator.');
                        await _supabase.auth.signOut();
                        localStorage.clear();
                        window.location.href = 'login.html?blocked=true';
                        return true;
                    }
                }

                if (userId) {
                    const { data: profile, error: profileError } = await _supabase
                        .from('profiles')
                        .select('is_blocked')
                        .eq('id', userId)
                        .maybeSingle();

                    if (!profileError && profile && profile.is_blocked === true) {
                        await _supabase.auth.signOut();
                        localStorage.clear();
                        window.location.href = 'login.html?blocked=true';
                        return true;
                    }
                }
            } catch (err) {
                console.error('Blocklist/Profile check error:', err);
            }
            return false;
        }

        async function checkUserSession() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session && session.user) {
                    const isBlocked = await checkBlocklist(session.user.email, session.user.id);
                    if (isBlocked) return;
                    loggedInUser = { type: 'google', user: session.user };
                } else {
                    const telegramUser = localStorage.getItem('telegram_user');
                    if (telegramUser) {
                        loggedInUser = { type: 'telegram', user: JSON.parse(telegramUser) };
                    }
                }
            } catch (err) {
                console.error('Session check error:', err);
                loggedInUser = null;
            }
        }
        function setupRealtimeBlockListener() {
            _supabase
                .channel('public:profiles_block_check')
                .on(
                    'postgres_changes',
                    { event: 'UPDATE', schema: 'public', table: 'profiles' },
                    async (payload) => {
                        const { data: { session } } = await _supabase.auth.getSession();
                        if (session && session.user && payload.new.id === session.user.id) {
                            if (payload.new.is_blocked === true) {
                                await _supabase.auth.signOut();
                                localStorage.clear();
                                alert('Your account has been restricted.');
                                window.location.href = 'login.html?blocked=true';
                            }
                        }
                    }
                )
                .subscribe();
        }

        function handleAccountClick() {
            if (loggedInUser) {
                window.location.href = 'users.html';
            } else {
                showLoginModal();
            }
        }

        function showLoginModal() {
            const modal = document.getElementById('login-modal');
            if (modal) modal.classList.remove('hidden');
        }

        function closeLoginModal() {
            const modal = document.getElementById('login-modal');
            if (modal) modal.classList.add('hidden');
        }

        function redirectToLogin() {
            sessionStorage.setItem('redirect_after_login', window.location.href);
            window.location.href = 'login.html';
        }

        async function fetchMainProjects() {
            const workGrid = document.getElementById('projects-grid');
            try {
                const { data, error } = await _supabase.from('main_projects').select('*').order('id', { ascending: false });
                if (error || !data) {
                    workGrid.innerHTML = '<p class="text-zinc-500">Failed to load projects.</p>';
                    return;
                }
                
                const workItems = data.filter(p => p.category === 'Design by Malin Keo' || !p.category);
                
                workGrid.innerHTML = workItems.length === 0 ? '<p class="text-zinc-500">No items found.</p>' : '';
                workItems.forEach(item => workGrid.appendChild(createCard(item)));
            } catch (err) {
                console.error('Fetch error:', err);
                workGrid.innerHTML = '<p class="text-zinc-500">Error loading data.</p>';
            }
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'group bg-zinc-900 border border-zinc-800 overflow-hidden cursor-pointer hover:border-zinc-600 transition rounded-sm';
            card.onclick = () => { window.location.href = `projects_detail.html?id=${encodeURIComponent(item.id)}`; };
            
            const fallbackImage = 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1000';
            const rawImageUrl = item.thumbnail_url || item.image_url || item.thumbnail;
            const resolvedImage = safeImageUrl(rawImageUrl) || fallbackImage;
            
            const category = escapeHTML(item.category || 'Design by Malin Keo');
            const title = escapeHTML(item.title || 'Untitled Project');
            const shortDesc = escapeHTML(item.short_description || item.description || '');

            card.innerHTML = `
                <div class="aspect-[4/3] bg-zinc-950 overflow-hidden">
                    <img src="${escapeHTML(resolvedImage)}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='${fallbackImage}'">
                </div>
                <div class="p-4 sm:p-6">
                    <span class="text-xs uppercase tracking-widest text-zinc-500 block mb-2">${category}</span>
                    <h3 class="text-base sm:text-xl font-medium mb-2 text-white">${title}</h3>
                    <p class="text-zinc-400 text-xs sm:text-sm font-light line-clamp-2">${shortDesc}</p>
                    <span class="inline-block mt-4 text-xs text-white underline underline-offset-4">View Details &rarr;</span>
                </div>
            `;
            return card;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await checkUserSession();
            setupRealtimeBlockListener();
            fetchMainProjects();
        });
    </script>
</body>
