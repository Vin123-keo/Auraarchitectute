<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aura Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kantumruy Pro', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 p-8 rounded-lg text-center space-y-6">
        <div>
            <span class="text-xs uppercase tracking-widest text-zinc-500 block mb-1">Authentication</span>
            <h1 class="text-2xl font-light">Sign In with Telegram</h1>
            <p class="text-xs text-zinc-400 mt-2">សូមចូលប្រព័ន្ធតាមរយៈ Telegram ដើម្បីបន្ត / Login via Telegram to continue</p>
        </div>

        <div class="flex justify-center py-4">
            <!-- Replace 'YOUR_BOT_USERNAME' with your actual Telegram Bot username -->
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                    data-telegram-login="YOUR_BOT_USERNAME" 
                    data-size="large" 
                    data-onauth="onTelegramAuth(user)" 
                    data-request-access="write">
            </script>
        </div>
    </div>

    <script>
        function onTelegramAuth(user) {
            // Save full Telegram user data (id, first_name, photo_url, username, etc.) to LocalStorage
            localStorage.setItem('telegram_user', JSON.stringify(user));

            // Check where user came from, or default back to index.html with construction tab
            const redirectUrl = sessionStorage.getItem('redirect_after_login') || 'index.html?tab=donework';
            sessionStorage.removeItem('redirect_after_login');
            
            window.location.href = redirectUrl;
        }
    </script>

</body>
</html>
