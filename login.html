<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aura Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kantumruy Pro', sans-serif; } </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-xl p-8 shadow-2xl">
        <button type="button" onclick="goBack()" class="inline-flex items-center gap-2 text-xs text-zinc-400 hover:text-white transition mb-6 cursor-pointer bg-transparent border-0 p-0" aria-label="Go Back">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back
        </button>
        <div class="text-center space-y-2 mb-8">
            <h1 class="text-2xl font-light uppercase tracking-widest text-white">Aura<span class="font-bold">Architecture</span></h1>
            <p class="text-xs text-zinc-400">Please sign in to send your request</p>
        </div>
        <div class="space-y-6">
            <div class="p-6 bg-zinc-950/80 rounded-lg border border-zinc-800 space-y-4">
                <span class="text-xs text-zinc-400 font-medium uppercase tracking-wider block text-center">Sign In With Google</span>
                <button type="button" onclick="handleGoogleLogin()" 
                        class="w-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-white font-medium py-3 px-4 rounded-lg transition flex items-center justify-center gap-3 text-xs tracking-wider cursor-pointer">
                    <svg class="w-4 h-4" aria-hidden="true" viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1.03 10.22 1.03 12s.4 3.45 1.15 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    </svg>
                    Continue with Google
                </button>
            </div>
        </div>
        <p id="login-status" class="text-xs text-center hidden mt-6" role="status" aria-live="polite"></p>
    </div>
    <script>
        const SUPABASE_URL = 'https://yqrjzrjcgjcsezimeeja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxcmp6cmpjZ2pjc2V6aW1lZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Nzg5NzMsImV4cCI6MjEwNDU1NDk3M30.bbYKOilE6OsgHEwmjoI0e-KBC5SMgH2bN2yYkzmItrk';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        function getElement(id) {
            return document.getElementById(id);
        }
        function sanitizeRedirectUrl(url) {
            if (typeof url !== 'string') return null;
            const trimmed = url.trim();
            if (!trimmed) return null;

            try {
                const parsed = new URL(trimmed, window.location.origin);
                if (parsed.origin === window.location.origin) {
                    return parsed.pathname + parsed.search + parsed.hash;
                }
            } catch (e) {}
            return null;
        }
        function goBack() {
            const rawRedirect = sessionStorage.getItem('redirect_after_login');
            const safeRedirect = sanitizeRedirectUrl(rawRedirect);
            window.location.href = safeRedirect || 'index.html';
        }
        async function handleGoogleLogin() {
            const statusMsg = getElement('login-status');
            statusMsg.textContent = "Redirecting to Google...";
            statusMsg.className = "text-xs text-center text-zinc-400 mt-6 block";

            const rawRedirect = sessionStorage.getItem('redirect_after_login');
            const safePath = sanitizeRedirectUrl(rawRedirect) || '/index.html';
            const redirectTarget = `${window.location.origin}${safePath}`;

            const { error } = await _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: redirectTarget }
            });
            if (error) {
                console.error("Google Auth Error:", error.message);
                statusMsg.textContent = "Authentication failed. Please try again.";
                statusMsg.className = "text-xs text-center text-rose-400 mt-6 block";
            }
        }
        async function checkIfUserIsBlocked(userId) {
            if (!userId) return false;
            try {
                const { data, error } = await _supabase
                    .from('profiles')
                    .select('is_blocked, status')
                    .or(`id.eq.${userId},user_id.eq.${userId}`)
                    .maybeSingle();

                if (!error && data) {
                    if (data.is_blocked === true || data.status === 'blocked' || data.status === 'inactive') {
                        return true;
                    }
                }
            } catch (e) {}
            return false;
        }

        async function checkLoginBlockAndRedirect() {
            const statusMsg = getElement('login-status');
            const params = new URLSearchParams(window.location.search);

            if (params.get('error') === 'blocked' || params.get('blocked') === 'true') {
                statusMsg.textContent = "Access denied. Your account has been blocked.";
                statusMsg.className = "text-xs text-center text-rose-400 mt-6 block font-medium";
                return;
            }

            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session?.user) {
                    const userId = session.user.id;
                    const isBlocked = await checkIfUserIsBlocked(userId);

                    if (isBlocked) {
                        await _supabase.auth.signOut();
                        localStorage.clear();
                        sessionStorage.clear();
                        
                        statusMsg.textContent = "Access denied. This account has been blocked by administration.";
                        statusMsg.className = "text-xs text-center text-rose-400 mt-6 block font-medium";
                    } else {
                        const rawRedirect = sessionStorage.getItem('redirect_after_login');
                        const safePath = sanitizeRedirectUrl(rawRedirect) || 'index.html';
                        window.location.href = safePath;
                    }
                }
            } catch (e) {
                console.error("Block verification error:", e);
            }
        }
        window.addEventListener('DOMContentLoaded', async () => {
            _supabase.auth.onAuthStateChange(async (event, session) => {
                if (session?.user) {
                    const isBlocked = await checkIfUserIsBlocked(session.user.id);
                    if (isBlocked) {
                        await _supabase.auth.signOut();
                        localStorage.clear();
                        sessionStorage.clear();
                        window.location.href = 'login.html?error=blocked';
                    }
                }
            });
            await checkLoginBlockAndRedirect();
        });
    </script>
</body>
</html>
