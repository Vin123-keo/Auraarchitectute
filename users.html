<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Aura Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-zinc-800">

    <!-- Navigation Bar -->
    <nav class="fixed top-0 left-0 w-full z-40 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
            <button onclick="goBack()" class="text-xs sm:text-sm uppercase tracking-widest text-zinc-400 hover:text-white transition flex items-center gap-2 bg-transparent border-0 p-0 cursor-pointer">
                <i class="fa-solid fa-arrow-left"></i> BACK
            </button>
            <span class="text-base sm:text-xl font-light tracking-widest uppercase">Aura<span class="font-bold">Architecture</span></span>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="pt-32 pb-24 max-w-xl mx-auto px-4 sm:px-6 min-h-screen flex items-center justify-center">
        
        <!-- Loading State -->
        <div id="loading-state" class="text-center text-zinc-500 py-10">
            <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3"></i>
            <p class="text-sm">Checking authentication status...</p>
        </div>

        <!-- User Profile Card -->
        <div id="profile-card" class="w-full bg-zinc-900/60 border border-zinc-800 p-8 sm:p-10 rounded-xl space-y-8 text-center hidden">
            
            <!-- Profile Image & Badge -->
            <div class="relative inline-block mx-auto">
                <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full overflow-hidden border-2 border-zinc-700 bg-zinc-950 mx-auto flex items-center justify-center">
                    <img id="user-avatar" src="" alt="Profile Image" class="w-full h-full object-cover hidden">
                    <i id="user-avatar-placeholder" class="fa-solid fa-user text-3xl text-zinc-600"></i>
                </div>
                <!-- Provider Badge (Google/Telegram) -->
                <span id="provider-badge" class="absolute bottom-0 right-0 bg-zinc-800 border border-zinc-700 text-xs text-zinc-300 px-2.5 py-1 rounded-full flex items-center gap-1.5 shadow-md">
                    <i id="provider-icon" class="fa-solid fa-user"></i>
                    <span id="provider-name">Auth</span>
                </span>
            </div>

            <!-- User Info Details -->
            <div class="space-y-2">
                <h2 id="user-name" class="text-xl sm:text-2xl font-light text-white tracking-wide">User Name</h2>
                <p id="user-identifier" class="text-xs sm:text-sm text-zinc-400 font-mono">user@example.com</p>
            </div>

            <hr class="border-zinc-800/80">

            <!-- Information Breakdown -->
            <div class="space-y-3 text-left bg-zinc-950/50 p-4 rounded-lg border border-zinc-800/60 text-xs sm:text-sm">
                <div class="flex justify-between items-center text-zinc-400">
                    <span>Login Type:</span>
                    <span id="info-auth-type" class="text-zinc-200 capitalize font-medium">-</span>
                </div>
                <div class="flex justify-between items-center text-zinc-400">
                    <span>User Account ID:</span>
                    <span id="info-user-id" class="text-zinc-200 font-mono text-xs truncate max-w-[180px] sm:max-w-[240px]">-</span>
                </div>
            </div>

            <!-- Log Out Button -->
            <button onclick="handleLogout()" class="w-full bg-red-950/40 hover:bg-red-900/60 border border-red-800/50 text-red-200 py-3 rounded-lg text-xs uppercase tracking-wider font-medium transition flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-right-from-bracket"></i> Log Out
            </button>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 border-t border-zinc-900 text-center text-xs text-zinc-600 px-4">
        <p>&copy; 2026 Architectural Portfolio. Powered by Supabase.</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://yqrjzrjcgjcsezimeeja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxcmp6cmpjZ2pjc2V6aW1lZWphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Nzg5NzMsImV4cCI6MjEwNDU1NDk3M30.bbYKOilE6OsgHEwmjoI0e-KBC5SMgH2bN2yYkzmItrk';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function goBack() {
            if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        async function initUserProfile() {
            const loadingState = document.getElementById('loading-state');
            const profileCard = document.getElementById('profile-card');

            try {
                // 1. Check Google Auth Session via Supabase
                const { data: { session } } = await _supabase.auth.getSession();
                
                if (session && session.user) {
                    renderGoogleUser(session.user);
                    loadingState.classList.add('hidden');
                    profileCard.classList.remove('hidden');
                    return;
                }

                // 2. Check Telegram Login via LocalStorage
                const telegramUserRaw = localStorage.getItem('telegram_user');
                if (telegramUserRaw) {
                    const tgUser = JSON.parse(telegramUserRaw);
                    renderTelegramUser(tgUser);
                    loadingState.classList.add('hidden');
                    profileCard.classList.remove('hidden');
                    return;
                }

                // 3. FALLBACK PREVIEW (Displays mock data for development instead of redirecting)
                renderPreviewUser();
                loadingState.classList.add('hidden');
                profileCard.classList.remove('hidden');

            } catch (err) {
                console.error("Error loading profile:", err);
                loadingState.innerHTML = '<p class="text-red-400 text-sm">Failed to load user profile.</p>';
            }
        }

        function renderGoogleUser(user) {
            const meta = user.user_metadata || {};
            const name = meta.full_name || meta.name || user.email || 'Google User';
            const avatar = meta.avatar_url || meta.picture || null;

            document.getElementById('user-name').innerText = name;
            document.getElementById('user-identifier').innerText = user.email || user.id;
            document.getElementById('info-auth-type').innerText = 'Google Account';
            document.getElementById('info-user-id').innerText = user.id;

            // Provider Icon
            document.getElementById('provider-icon').className = 'fa-brands fa-google text-red-400';
            document.getElementById('provider-name').innerText = 'Google';

            // Avatar Setup
            setAvatar(avatar);
        }

        function renderTelegramUser(user) {
            const name = [user.first_name, user.last_name].filter(Boolean).join(' ') || user.username || 'Telegram User';
            const identifier = user.username ? `@${user.username}` : `ID: ${user.id}`;
            const avatar = user.photo_url || null;

            document.getElementById('user-name').innerText = name;
            document.getElementById('user-identifier').innerText = identifier;
            document.getElementById('info-auth-type').innerText = 'Telegram';
            document.getElementById('info-user-id').innerText = user.id;

            // Provider Icon
            document.getElementById('provider-icon').className = 'fa-brands fa-telegram text-sky-400';
            document.getElementById('provider-name').innerText = 'Telegram';

            // Avatar Setup
            setAvatar(avatar);
        }

        function renderPreviewUser() {
            document.getElementById('user-name').innerText = 'Demo User';
            document.getElementById('user-identifier').innerText = 'demo@auraarchitecture.com';
            document.getElementById('info-auth-type').innerText = 'Preview Mode';
            document.getElementById('info-user-id').innerText = 'usr_demo_123456789';

            document.getElementById('provider-icon').className = 'fa-solid fa-eye text-zinc-400';
            document.getElementById('provider-name').innerText = 'Preview';
        }

        function setAvatar(url) {
            const avatarImg = document.getElementById('user-avatar');
            const placeholder = document.getElementById('user-avatar-placeholder');

            if (url) {
                avatarImg.src = url;
                avatarImg.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                avatarImg.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        async function handleLogout() {
            // Clear Supabase Session
            await _supabase.auth.signOut();

            // Clear Telegram Local Storage Data
            localStorage.removeItem('telegram_user');
            sessionStorage.clear();

            // Redirect back to login page
            window.location.href = 'login.html';
        }

        window.addEventListener('DOMContentLoaded', initUserProfile);
    </script>
</body>
</html>
